name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build calipers
        run: go build -o calipers ./cmd/calipers

      - name: Test
        run: go test ./...

  crossbuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cross-build cmd/calipers
        run: |
          set -e
          export CGO_ENABLED=0
          for spec in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 freebsd/amd64; do
            GOOS=${spec%/*} GOARCH=${spec#*/} go build -o /dev/null ./cmd/calipers
          done
